name: Bug report
description: Something does not work in firefly-iii-multisource
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is an **unofficial fork** of Firefly III. Please do not report problems from this fork to the Firefly III team.
        AI assistance is welcome here, but please check what you submit.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Split transactions with multiple source/destination accounts
        - Release build / GitHub workflow
        - firefly-update (LXC update script)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Does it also happen in upstream Firefly III?
      options:
        - "No – only in this fork"
        - "Yes – also in upstream"
        - Not tested
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `firefly-update --check` or the release tag (e.g. v6.7.7-multisource)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Workflow log, `storage/logs/*.log`, script output (remove personal data)
