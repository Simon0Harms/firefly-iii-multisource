name: Feature request
description: Suggest a change to the fork (not to Firefly III itself)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This fork only adds multi-account splits plus its build/update tooling.
        General Firefly III features belong upstream: https://github.com/firefly-iii/firefly-iii/discussions
  - type: textarea
    id: request
    attributes:
      label: What should change and why?
    validations:
      required: true
